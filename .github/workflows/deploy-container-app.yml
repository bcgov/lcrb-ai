name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

env:
  AZURE_CONTAINER_APP_NAME: lcrb-ai-orch      # Update with your Container App name
  AZURE_RESOURCE_GROUP: <your-resource-group>  # Update with your resource group
  AZURE_CONTAINER_REGISTRY: <your-acr-name>    # Update with your ACR name (without .azurecr.io)
  IMAGE_NAME: lcrb-ai-orchestrator

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build and push container image
        run: |
          az acr build \
            --registry ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
